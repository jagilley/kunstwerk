# Claudio Abbado / Wiener Philharmoniker, DG 1994.
#   Figaro     Lucio Gallo          Countess   Cheryl Studer
#   Susanna    Sylvia McNair        Cherubino  Cecilia Bartoli
#   Count      Bo Skovhus           Marcellina Anna Caterina Antonacci
#   Barbarina  Andrea Rost          Basilio    Carlo Allemano
# 81 tracks / 2:49:41. Every recitative is its own track with its incipit in the
# title, which is what find_track_anchors wants; textually complete, including
# Marcellina's No. 24 "Il capro e la capretta" and Basilio's No. 25 "In quegli anni".
album_url: https://music.youtube.com/browse/MPREb_relL9n5US66

# Tracks 80 and 81 are the appendix replacement arias (K. 579 "Un moto di gioia",
# K. 577 "Al desio di chi t'adora") — not in the standard libretto, so they are
# excluded from the video.  end_idx is EXCLUSIVE: range(1, 80) = tracks 01..79,
# which ends on the No. 29 Finale (e-g), i.e. "Contessa, perdono".
start_idx: 1
end_idx: 80

