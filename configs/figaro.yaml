# detect_instrumental.py misses the Overture on this recording: it lands at
# vocal_frac 0.129 / 32.0 s of "vocals", just over both thresholds (0.10, 30 s),
# because demucs leaks the presto's high woodwind and violin lines into the vocals
# stem.  The whole-track cross-check is unambiguous — track 01 is -27.2 dB where the
# next-quietest track is -17.2 and the median is -1.7 — so pin it by hand.  Without
# this, Scribe hallucinates fluent Italian over 4 minutes of orchestra and the DP
# matches it against the opening of Act I.
overture_indices: [1]
